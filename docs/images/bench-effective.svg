<text x="40.0" y="48.0" class="t" text-anchor="start">Every ZXC level delivers more data per compressed byte than LZ4</text>
<text x="40.0" y="74.0" class="st mu" text-anchor="start">Effective throughput = decompression speed ÷ compression ratio, relative to LZ4 1.10.0 · Silesia · single thread</text>
<text x="920.0" y="74.0" class="st mu" text-anchor="end">→ longer is better</text>
