<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" role="img" aria-label="Effective throughput relative to LZ4 for each codec on four CPUs: every ZXC level is above LZ4"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:11px}.t{font-size:24px;font-weight:700}.st{font-size:14px}.pt{font-size:15px;font-weight:600}.pa{font-size:13px;font-weight:400}.b{font-weight:600}.lg{font-size:13px}.num{font-variant-numeric:tabular-nums}.grid,.axis{stroke-width:1}.halo{paint-order:stroke;stroke-width:4;stroke-linejoin:round}.bg{fill:#ffffff}text{fill:#1f2328}.mu{fill:#656d76}.grid{stroke:#e6e8eb}.axis{stroke:#afb8c1}.zp{fill:#0969da}.gp{fill:#8c959f}.halo{stroke:#ffffff}.vp{fill:#a475f9}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}text{fill:#e6edf3}.mu{fill:#8d96a0}.grid{stroke:#21262d}.axis{stroke:#3d444d}.zp{fill:#4493f8}.gp{fill:#6e7681}.halo{stroke:#0d1117}.vp{fill:#bc8cff}}.m{text-anchor:middle}.e{text-anchor:end}</style><rect class="bg" width="960" height="584" rx="8"/><text x="40" y="48" class="t">Every ZXC level delivers more data per compressed byte than other codecs</text><text x="40" y="74" class="st mu">Effective throughput = decompression speed ÷ compression ratio, relative to LZ4 1.10.0 · Silesia · single thread</text><text x="920" y="74" class="st mu e">→ longer is better</text><rect class="zp" x="42" y="98" width="24" height="12" rx="3"/><text x="76" y="108" class="lg">ZXC</text><rect class="vp" x="127.6" y="98" width="24" height="12" rx="3"/><text x="161.6" y="108" class="lg">LZ4</text><rect class="gp" x="213.2" y="98" width="24" height="12" rx="3"/><text x="247.2" y="108" class="lg">other codecs</text><text x="136" y="180" class="lg b e">zxc -1</text><text x="136" y="204" class="lg b e">zxc -2</text><text x="136" y="228" class="lg b e">zxc -3</text><text x="136" y="252" class="lg b e">zxc -4</text><text x="136" y="276" class="lg b e">zxc -5</text><text x="