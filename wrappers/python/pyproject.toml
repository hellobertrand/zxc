[build-system]
requires = ["scikit-build-core>=0.9", "setuptools_scm[toml]>=7.0"]
build-backend = "scikit_build_core.build"

[project]
name = "zxc-compress"
dynamic = ["version"]  
description = "ZXC: Package for high-performance asymmetric lossless compression built for ultra-fast decode"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/hellobertrand/zxc"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = ["src/zxc"]
wheel.exclude = ["*.c"]
sdist.include = ["zxc-core"]

[[tool.scikit-build.generate]]
path = "zxc/_version.py"
template = '__version__ = "${version}"'

[tool.setuptools_scm]
root = "../../"
version_scheme = "only-version"
local_scheme = "no-local-version"