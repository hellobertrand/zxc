version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /bindings/rust
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /bindings/nodejs
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly