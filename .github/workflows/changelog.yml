name: Changelog

on:
  workflow_dispatch:
  push:
    branches:
      - 'bump/**'
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate CHANGELOG
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/heads/(bump|release)/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            DETECTED="v${BASH_REMATCH[2]}"
            echo "tag_arg=--tag $DETECTED" >> "$GITHUB_OUTPUT"
            echo "Detected tag from branch name: $DETECTED"
          else
            echo "tag_arg=" >> "$GITHUB_OUTPUT"
            echo "No tag determined — latest section will be 'Unreleased'."
          fi

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose ${{ steps.ver.outputs.tag_arg }}
        env:
          OUTPUT: CHANGELOG
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload CHANGELOG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CHANGELOG
          path: CHANGELOG
