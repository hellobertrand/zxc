name: Code Security

on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp', 'rust', 'python', 'go', 'javascript-typescript' ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Build Project
      run: |
        if [ "${{ matrix.language }}" = "c-cpp" ]; then
          make
        elif [ "${{ matrix.language }}" = "rust" ]; then
          cd bindings/rust
          cargo build --workspace --all-targets
        elif [ "${{ matrix.language }}" = "python" ]; then
          python3 -m pip install --require-hashes -r bindings/python/requirements/build-deps.txt
          python3 -m pip install -e bindings/python --no-build-isolation --no-deps
        elif [ "${{ matrix.language }}" = "go" ]; then
          cd bindings/go
          CGO_ENABLED=1 go build ./...
        elif [ "${{ matrix.language }}" = "javascript-typescript" ]; then
          cd bindings/nodejs
          npm ci
        fi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{ matrix.language }}"
