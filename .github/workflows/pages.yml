name: Website

# Builds libzxc.org from site/ and deploys it to Cloudflare (Workers static assets)

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      docs_ref:
        description: 'Git ref to read docs/ from (default: latest release tag)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    # Library releases only: wrapper tags such as wrappers/go/v1.2.3 do not rebuild the site.
    if: github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            site

      - name: Resolve documentation ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.docs_ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "release" ]; then
            ref="$RELEASE_TAG"
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            ref="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Unexpected ref: $ref"; exit 1
          fi
          echo "Documentation will be built from: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout documentation at ${{ steps.ref.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: _docs_src
          persist-credentials: false
          sparse-checkout: |
            docs
            include
            src/cli
            src/lib

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends doxygen

      - name: Build
        working-directory: site
        env:
          REPO_ROOT: ${{ github.workspace }}/_docs_src
          SOURCE_BRANCH: ${{ steps.ref.outputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://libzxc.org
        run: node build.mjs

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live in this environment, restricted to main and v* tags.
    environment:
      name: cloudflare
      url: https://libzxc.org
    steps:
      - name: Checkout Wrangler configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/dist

      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          workingDirectory: site
          command: deploy
