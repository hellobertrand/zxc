name: Website

# Builds libzxc.org from site/ and deploys it to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      docs_ref:
        description: 'Git ref to read docs/ from (default: latest release tag)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    # Library releases only: wrapper tags such as wrappers/go/v1.2.3 do not rebuild the site.
    if: github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            site

      - name: Resolve documentation ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.docs_ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "release" ]; then
            ref="$RELEASE_TAG"
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            ref="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Unexpected ref: $ref"; exit 1
          fi
          echo "Documentation will be built from: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout documentation at ${{ steps.ref.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: _docs_src
          persist-credentials: false
          sparse-checkout: |
            docs
            include
            src/lib

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends doxygen

      - name: Build
        working-directory: site
        env:
          REPO_ROOT: ${{ github.workspace }}/_docs_src
          SOURCE_BRANCH: ${{ steps.ref.outputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://libzxc.org
        run: node build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
