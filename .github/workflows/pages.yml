name: Website

# Builds libzxc.org from site/ and deploys it to Cloudflare (Workers static assets)

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      docs_ref:
        description: 'Git ref to read docs/ from (default: latest release tag)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    # Library releases only: wrapper tags such as wrappers/go/v1.2.3 do not rebuild the site.
    if: github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          persist-credentials: false
          sparse-checkout: |
            site

      - name: Resolve documentation ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.docs_ref }}
          REPO: ${{ github.repository }}
        run: |
          newest="$( { [ "$EVENT" = "release" ] && printf '%s\n' "$RELEASE_TAG"
            gh api --paginate "repos/$REPO/releases" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name'; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)" || true
          if [ "$EVENT" != "release" ] && [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            ref="$newest"
            if [ "$EVENT" = "release" ] && [ "$RELEASE_TAG" != "$newest" ]; then
              echo "Release $RELEASE_TAG is older than $newest: keeping the $newest docs"
            fi
          fi
          if [ -z "$ref" ]; then
            echo "::error::No published v* release to build the docs from"; exit 1
          fi
          if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Unexpected ref: $ref"; exit 1
          fi
          echo "Documentation will be built from: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout documentation at ${{ steps.ref.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: _docs_src
          persist-credentials: false
          sparse-checkout: |
            docs
            include
            src/cli
            src/lib

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends doxygen

      - name: Build
        working-directory: site
        env:
          REPO_ROOT: ${{ github.workspace }}/_docs_src
          SOURCE_BRANCH: ${{ steps.ref.outputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://libzxc.org
        run: node build.mjs

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live in this environment, restricted to main and v* tags.
    environment:
      name: cloudflare
      url: https://libzxc.org
    steps:
      - name: Checkout Wrangler configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          persist-credentials: false
          sparse-checkout: |
            site/wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/dist

      - name: Deploy
        env:
          WRANGLER_SEND_METRICS: "false"
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          workingDirectory: site
          command: deploy
