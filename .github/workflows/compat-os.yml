name: OS (libc) Compatibility

# Portability across the OS / libc axis (orthogonal to multiarch.yml, which
# covers CPU architectures on glibc Linux):
#   - musl libc (Alpine): catches non-glibc bugs the rest of CI can't see
#     (e.g. the 128 KB default thread stack vs glibc's 8 MB). Native on both
#     x86_64 and arm64 runners via an Alpine container.
#   - Arch Linux / AlmaLinux 9 (RHEL 9): newest vs enterprise GCC, each with
#     its distro's packaging flags (makepkg.conf, %optflags).
#   - Amazon Linux 2023: the Graviton (arm64) cloud target.
#   - FreeBSD: non-glibc / clang-default portability canary, and the BSD that
#     matters for packaging (ports, TrueNAS/ZFS, pfSense). Built in a VM via
#     cross-platform-actions (no native BSD runners exist); x86_64 only, as
#     FreeBSD arm64 would be QEMU-emulated and slow.
# All run the full STATIC+SHARED ctest suite and exercise runtime SIMD
# dispatch (ZXC_NATIVE_ARCH=OFF).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, candidate ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  build-compat:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (Alpine musl)
            kind: container
            runner: ubuntu-latest
            image: alpine:latest
            setup: apk add --no-cache build-base cmake
          - name: Linux arm64 (Alpine musl)
            kind: container
            runner: ubuntu-24.04-arm
            image: alpine:latest
            setup: apk add --no-cache build-base cmake
          # makepkg.conf references unset variables.
          - name: Linux x86_64 (Arch Linux)
            kind: container
            runner: ubuntu-latest
            image: archlinux:latest
            setup: >-
              pacman -Syu --noconfirm --needed gcc cmake make &&
              set +u && . /etc/makepkg.conf && set -u &&
              export CFLAGS="$CFLAGS ${LTOFLAGS:-}" LDFLAGS="$LDFLAGS ${LTOFLAGS:-}"
          - name: Linux x86_64 (AlmaLinux 9 / RHEL 9)
            kind: container
            runner: ubuntu-latest
            image: almalinux:9
            setup: >-
              dnf -y install gcc cmake make redhat-rpm-config annobin-plugin-gcc &&
              export CFLAGS="$(rpm --eval %optflags)"
          - name: Linux arm64 (Amazon Linux 2023)
            kind: container
            runner: ubuntu-24.04-arm
            image: amazonlinux:2023
            setup: dnf -y install gcc cmake make
          - name: FreeBSD 14.4 x86_64
            kind: bsd
            runner: ubuntu-latest
            os: freebsd
            arch: x86-64
            version: "14.4"
            install: sudo pkg install -y cmake ninja
          - name: FreeBSD 15.1 x86_64
            kind: bsd
            runner: ubuntu-latest
            os: freebsd
            arch: x86-64
            version: "15.1"
            install: sudo pkg install -y cmake ninja

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux distros: build & test inside a container.
      - name: Configure, Build & Test in ${{ matrix.image }} (Static & Shared)
        if: matrix.kind == 'container'
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src ${{ matrix.image }} sh -euc '
            ${{ matrix.setup }}
            echo "=== Toolchain ==="
            cc --version
            cmake --version
            echo "CFLAGS=${CFLAGS:-}"
            echo "LDFLAGS=${LDFLAGS:-}"

            for LIB_TYPE in STATIC SHARED; do
                echo ">>> Starting Build: $LIB_TYPE"
                BUILD_DIR="build_$LIB_TYPE"

                SHARED_FLAG=OFF
                if [ "$LIB_TYPE" = SHARED ]; then SHARED_FLAG=ON; fi

                cmake -S . -B "$BUILD_DIR" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                    -DZXC_NATIVE_ARCH=OFF \
                    -DBUILD_SHARED_LIBS="$SHARED_FLAG"

                cmake --build "$BUILD_DIR" --parallel

                echo "Running Tests for $LIB_TYPE..."
                ctest --test-dir "$BUILD_DIR" --output-on-failure

                echo ">>> Completed Build: $LIB_TYPE"
                echo ""
            done
          '

      # FreeBSD: boot the VM, then build & test inside it via the cpa.sh shell
      - name: Start FreeBSD VM
        if: matrix.kind == 'bsd'
        uses: cross-platform-actions/action@faa0c6197e94aacf1c5956460152c8380d3560a5 # v1.5.0
        with:
          operating_system: ${{ matrix.os }}
          architecture: ${{ matrix.arch }}
          version: ${{ matrix.version }}
          memory: 5G
          cpu_count: 4

      # Runs inside the VM
      - name: Configure, Build & Test on FreeBSD (Static & Shared)
        if: matrix.kind == 'bsd'
        shell: cpa.sh {0}
        run: |
          set -e
          ${{ matrix.install }}
          echo "=== Toolchain ==="
          cc --version 2>/dev/null || true
          cmake --version

          for LIB_TYPE in STATIC SHARED; do
              echo ">>> Starting Build: $LIB_TYPE"
              BUILD_DIR="build_$LIB_TYPE"

              SHARED_FLAG=OFF
              if [ "$LIB_TYPE" = SHARED ]; then SHARED_FLAG=ON; fi

              cmake -S . -B "$BUILD_DIR" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                  -DZXC_NATIVE_ARCH=OFF \
                  -DBUILD_SHARED_LIBS="$SHARED_FLAG"

              cmake --build "$BUILD_DIR" --parallel

              echo "Running Tests for $LIB_TYPE..."
              ctest --test-dir "$BUILD_DIR" --output-on-failure

              echo ">>> Completed Build: $LIB_TYPE"
              echo ""
          done
