name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  build-and-test:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact_name: zxc
            platform: linux-x86_64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            artifact_name: zxc
            platform: linux-arm64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: macOS ARM64
            os: macos-26
            artifact_name: zxc
            platform: macos-arm64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: Windows x86_64
            os: windows-latest
            artifact_name: zxc.exe
            platform: windows-x86_64
            cmake_flags: "-A x64 -DZXC_NATIVE_ARCH=OFF"
          - name: Windows ARM64
            os: windows-11-arm
            artifact_name: zxc.exe
            platform: windows-arm64
            cmake_flags: "-A ARM64 -DZXC_NATIVE_ARCH=OFF"


    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Latest Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Select Latest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          clang --version

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build 
        run: cmake --build build --config Release --parallel

      - name: Test (native)
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Test CLI
        shell: bash
        run: |
          BUILD_DIR="build"
          # Find binary (handle both Ninja and Visual Studio generators)
          if [ -f "$BUILD_DIR/Release/${{ matrix.artifact_name }}" ]; then
            ZXC_BIN="$BUILD_DIR/Release/${{ matrix.artifact_name }}"
          elif [ -f "$BUILD_DIR/${{ matrix.artifact_name }}" ]; then
            ZXC_BIN="$BUILD_DIR/${{ matrix.artifact_name }}"
          else
            echo "Binary not found for CLI test!"
            find "$BUILD_DIR" -name "${{ matrix.artifact_name }}"
            exit 1
          fi
          
          echo "Testing with binary: $ZXC_BIN"
          chmod +x tests/test_cli.sh
          ./tests/test_cli.sh "$ZXC_BIN"

      - name: Package Release (Archive)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_BASE="zxc-${VERSION}-${{ matrix.platform }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ARCHIVE="${ARCHIVE_BASE}.zip"
          else
            ARCHIVE="${ARCHIVE_BASE}.tar.gz"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          # Install to staging directory using CMake (Standard way for all OS)
          cmake --install build --prefix "release_staging/${ARCHIVE_BASE}" --config Release

          # Strip binary on Unix-like systems only (installed to bin/)
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            strip "release_staging/${ARCHIVE_BASE}/bin/${{ matrix.artifact_name }}"
          fi

          cp LICENSE "release_staging/${ARCHIVE_BASE}/LICENSE.txt"
          cp docs/man/zxc.1.md "release_staging/${ARCHIVE_BASE}/MANUAL.md"
          cat > "release_staging/${ARCHIVE_BASE}/README.md" <<EOF
          # ZXC ${VERSION}

          Asymmetric Lossless Compression Built for Ultra-Fast Decode

          **Contents:**
          - \`bin/\` — \`zxc\` CLI compressor/decompressor
          - \`lib/\` — shared and static libraries
          - \`include/\` — C headers

          **CLI usage:** See [MANUAL.md](MANUAL.md) for the full reference (synopsis, options, examples).

          **Release history:** https://github.com/${GITHUB_REPOSITORY}/releases

          **Documentation, benchmarks & source:** https://github.com/${GITHUB_REPOSITORY}

          **Verify build provenance (SLSA):** every archive is signed via [GitHub Artifact Attestations](https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds). Verify with:
          \`\`\`
          gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}
          \`\`\`

          License: BSD-3-Clause (see LICENSE.txt)
          EOF

          # Create archive with versioned top-level directory
          cd release_staging
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "../${ARCHIVE}" "${ARCHIVE_BASE}"
          else
            tar -czvf "../${ARCHIVE}" "${ARCHIVE_BASE}"
          fi

      - name: Attest build provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zxc-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  source-tarball:
    name: Canonical source tarball
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build the source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git archive --format=tar --prefix="zxc-${VERSION}/" "$GITHUB_SHA" \
            > "zxc-${VERSION}.tar"
          gzip -n -9 -c "zxc-${VERSION}.tar" > "zxc-${VERSION}.tar.gz"
          git --version          # git archive is byte-stable per git version, so log it
          sha256sum "zxc-${VERSION}.tar.gz"

      - name: Compress the same tar with zxc
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZXC_NATIVE_ARCH=OFF \
                -DZXC_BUILD_TESTS=OFF
          cmake --build build --parallel
          ZXC=$(find build -type f -name zxc -perm -u+x | head -1)
          test -n "$ZXC" || { echo "::error::no zxc binary under build/"; find build -name 'zxc*'; exit 1; }
          "$ZXC" -7 "zxc-${VERSION}.tar" -o "zxc-${VERSION}.tar.zxc"   # 7 = ULTRA, the densest level
          ls -l "zxc-${VERSION}.tar" "zxc-${VERSION}.tar.gz" "zxc-${VERSION}.tar.zxc"

      - name: Attest source tarball provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            zxc-${{ env.VERSION }}.tar.gz
            zxc-${{ env.VERSION }}.tar.zxc

      - name: Upload source artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: |
            zxc-${{ env.VERSION }}.tar.gz
            zxc-${{ env.VERSION }}.tar.zxc

  sbom:
    name: Generate SBOM
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sanitize ref name
        id: ref
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "version=${slug#v}" >> "$GITHUB_OUTPUT"

      - name: Render SBOM from template
        shell: bash
        env:
          SBOM_FILE: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json
          VERSION: ${{ steps.ref.outputs.slug }}
          COMMIT: ${{ github.sha }}
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed \
            -e "s|@VERSION@|${VERSION}|g" \
            -e "s|@COMMIT@|${COMMIT}|g" \
            -e "s|@CREATED@|${CREATED}|g" \
            sbom.spdx.json.in > "$SBOM_FILE"
          # Validate JSON syntax
          jq empty "$SBOM_FILE"

      - name: Attest SBOM provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json

  release:
    name: Upload the release assets
    needs: [build-and-test, source-tarball, sbom]
    outputs:
      digests: ${{ steps.sums.outputs.digests }}
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.zxc' -o -name '*.zip' \
            -o -name '*.spdx.json' \) -exec mv {} release/ \;
          ls -la release

      - name: Generate SHA256SUMS
        id: sums
        working-directory: release
        run: |
          sha256sum -- * | LC_ALL=C sort -k2 > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS
          # The same inventory feeds the signed manifest and the SLSA subjects, so the
          # two can no longer describe different sets of files.
          echo "digests=$(base64 -w0 < SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Attach them to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

  sign-release:
    name: Sign the manifest and source tarballs
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download what gets signed
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          # Named one by one: `zxc-*.tar.gz` would also match the platform archives.
          gh release download "$GITHUB_REF_NAME" --dir sign \
            -p SHA256SUMS -p "zxc-$V.tar.gz" -p "zxc-$V.tar.zxc"
          ls -l sign

      - name: Sign and upload
        working-directory: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # SHA256SUMS alone covers every artifact cryptographically;
          sha256sum -c SHA256SUMS --ignore-missing

          echo "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          
          for f in SHA256SUMS "zxc-$V.tar.gz" "zxc-$V.tar.zxc"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --armor "$f"
          done
          gh release upload "$GITHUB_REF_NAME" ./*.asc --clobber

      - name: Release the wrappers
        run: |
          for w in wrapper-python wrapper-nodejs wrapper-wasm wrapper-rust wrapper-go; do
            gh workflow run "$w.yml" --ref "$GITHUB_REF_NAME"
          done

  provenance:
    name: SLSA provenance
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: write
      id-token: write   # keyless signing via Sigstore / OIDC
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.digests }}
      upload-assets: false

  attach-provenance:
    name: Attach SLSA provenance
    needs: provenance
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: '*.intoto.jsonl*'

      - name: Attach it to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prov=$(find artifacts -type f -name '*.intoto.jsonl' | head -1)
          test -n "$prov" \
            || { echo "::error::no *.intoto.jsonl among the run artifacts"; find artifacts -type f; exit 1; }
          echo "attaching $(basename "$prov")"
          gh release upload "$GITHUB_REF_NAME" "$prov" --clobber
