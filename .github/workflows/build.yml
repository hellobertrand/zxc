name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]      # pre-flight: build and test before the release goes public
  pull_request:
    branches: [ main, candidate ]
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name != 'release' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  build-test-unix:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux-x86_64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux-arm64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: macOS ARM64
            os: macos-26
            platform: macos-arm64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"


    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GCC 14: the compiler of the published benchmarks
      - name: Select Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build 
        run: cmake --build build --parallel

      # The released zxc must start on glibc 2.34 (RHEL 9, Debian 12, Ubuntu 22.04).
      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          needs=$(objdump -p build/zxc | sed -n '/Version References/,$p' | grep -o 'GLIBC_[A-Z0-9_.]*' | sort -u)
          echo "$needs"
          # GLIBC_ABI_* markers (e.g. DT_RELR) and any version above 2.34 break the floor.
          too_new=$(for v in $needs; do
            case "$v" in
              GLIBC_ABI_*) echo "$v" ;;
              *) [ "$(printf '%s\n' 2.34 "${v#GLIBC_}" | sort -V | tail -1)" = 2.34 ] || echo "$v" ;;
            esac
          done)
          if [ -n "$too_new" ]; then
            echo "::error::zxc requires more than glibc 2.34:" $too_new
            exit 1
          fi

      - name: Test (native)
        working-directory: build
        run: ctest --output-on-failure

      - name: Test CLI
        run: ./tests/test_cli.sh build/zxc

      - name: Package Release (Archive)
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_BASE="zxc-${VERSION}-${{ matrix.platform }}"
          ARCHIVE="${ARCHIVE_BASE}.tar.gz"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          STAGE="release_staging/${ARCHIVE_BASE}"

          cmake --install build --prefix "$STAGE"
          .github/scripts/stage-release-docs.sh "$VERSION" "$STAGE" <<'EOF'
          - `bin/zxc` — CLI compressor/decompressor
          - `lib/libzxc.a` — static library, with pkg-config and CMake files
          - `include/` — C headers
          EOF

          # Create archive with versioned top-level directory
          cd release_staging
          tar -czvf "../${ARCHIVE}" "${ARCHIVE_BASE}"

      - name: Upload Artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zxc-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  # MinGW-w64 on the UCRT: a static runtime, so nothing to install.
  # MSVC users build the import library from the shipped libzxc.def.
  build-test-windows:
    name: Build Windows ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: windows-latest
            msystem: UCRT64
            pkg_prefix: mingw-w64-ucrt-x86_64
            cc: gcc
            machine: x64
            platform: windows-x86_64
          # No GCC for Windows ARM64: Clang on the same runtime.
          - name: ARM64
            os: windows-11-arm
            msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            cc: clang
            machine: arm64
            platform: windows-arm64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: >-
            ${{ matrix.pkg_prefix }}-${{ matrix.cc }}
            diffutils
            zip

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -static embeds the compiler runtime; --output-def lists the DLL's exports.
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} -DZXC_NATIVE_ARCH=OFF \
              -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build --parallel
          cmake -S . -B build-dll -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} -DZXC_NATIVE_ARCH=OFF -DBUILD_SHARED_LIBS=ON \
              -DZXC_BUILD_CLI=OFF -DZXC_BUILD_TESTS=OFF -DZXC_INSTALL=OFF \
              -DCMAKE_SHARED_LINKER_FLAGS="-static -Wl,--output-def,libzxc.def"
          cmake --build build-dll --parallel
          sed -i '/^LIBRARY/d; 1i LIBRARY libzxc.dll' build-dll/libzxc.def

      # The consumer loads the shipped DLL, through its MinGW import library.
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ./tests/test_cli.sh build/zxc.exe
          ${{ matrix.cc }} -O2 -Iinclude -DZXC_DLL_IMPORT tests/packaging/consumer.c \
              build-dll/libzxc.dll.a -o build-dll/consumer.exe
          (cd build-dll && ./consumer.exe)

      # Only Windows' own DLLs: no redistributable, no libgcc or libwinpthread.
      - name: Check runtime dependencies
        run: |
          objdump=$(command -v objdump || command -v llvm-objdump) \
              || { echo "::error::no objdump in this environment"; exit 1; }
          for f in build/zxc.exe build-dll/libzxc.dll; do
            deps=$("$objdump" -p "$f" | awk '/DLL Name:/ {print $3}')
            test -n "$deps" || { echo "::error::$f: no imports listed"; exit 1; }
            bad=$(printf '%s\n' "$deps" | grep -viE '^(KERNEL32|api-ms-win-crt-[a-z0-9-]+)\.dll$' || true)
            if [ -n "$bad" ]; then
              echo "::error::$f imports: $(printf '%s' "$bad" | tr '\n' ' ')"
              exit 1
            fi
          done

      - name: Package Release (Archive)
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_BASE="zxc-${VERSION}-${{ matrix.platform }}"
          ARCHIVE="${ARCHIVE_BASE}.zip"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          STAGE="release_staging/${ARCHIVE_BASE}"
          cmake --install build --prefix "$STAGE"
          cp build-dll/libzxc.dll "$STAGE/bin/"
          cp build-dll/libzxc.dll.a build-dll/libzxc.def "$STAGE/lib/"
          for f in bin/zxc.exe bin/libzxc.dll lib/libzxc.dll.a lib/libzxc.def lib/libzxc.a \
                   lib/cmake/zxc/zxcConfig.cmake lib/pkgconfig/libzxc.pc include/zxc.h; do
            test -f "$STAGE/$f" || { echo "::error::$f missing from the archive"; exit 1; }
          done
          .github/scripts/stage-release-docs.sh "$VERSION" "$STAGE" <<'EOF'
          Built with MinGW-w64 on the UCRT, which Windows 10 and later include; no Visual C++ runtime needed.
          - `bin/zxc.exe` — CLI compressor/decompressor
          - `bin/libzxc.dll` — shared library (C ABI); `lib/libzxc.dll.a` is its MinGW import library
          - `lib/libzxc.def` — its exports: MSVC users run `lib /def:lib\libzxc.def /out:zxc.lib /machine:${{ matrix.machine }}`, define `ZXC_DLL_IMPORT` and build with `/MD` to pass `FILE*`s
          - `lib/libzxc.a` — static library for UCRT MinGW toolchains such as MSYS2 ${{ matrix.msystem }}; `-lzxc` picks the DLL, `-static` this one
          - `lib/pkgconfig/`, `lib/cmake/` — for MinGW toolchains (the CMake package imports the static library)
          - `include/` — C headers
          EOF

          cd release_staging
          zip -r "../${ARCHIVE}" "${ARCHIVE_BASE}"

      - name: Upload Artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zxc-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  source-tarball:
    name: Canonical source tarball
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git archive --format=tar --prefix="zxc-${VERSION}/" "$GITHUB_SHA" \
            > "zxc-${VERSION}.tar"
          gzip -n -9 -c "zxc-${VERSION}.tar" > "zxc-${VERSION}.tar.gz"
          sha256sum "zxc-${VERSION}.tar.gz"

      - name: Compress the same tar with zxc
        env:
          CC: gcc-14
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZXC_NATIVE_ARCH=OFF \
                -DZXC_BUILD_TESTS=OFF
          cmake --build build --parallel
          ZXC=$(find build -type f -name zxc -perm -u+x | head -1)
          test -n "$ZXC" || { echo "::error::no zxc binary under build/"; find build -name 'zxc*'; exit 1; }
          "$ZXC" -7 "zxc-${VERSION}.tar" -o "zxc-${VERSION}.tar.zxc"   # 7 = ULTRA, the densest level

      - name: Upload source artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: |
            zxc-${{ env.VERSION }}.tar.gz
            zxc-${{ env.VERSION }}.tar.zxc

  sbom:
    name: Generate SBOM
    if: github.event_name == 'release'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sanitize ref name
        id: ref
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "version=${slug#v}" >> "$GITHUB_OUTPUT"

      - name: Render SBOM from template
        shell: bash
        env:
          SBOM_FILE: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json
          VERSION: ${{ steps.ref.outputs.slug }}
          COMMIT: ${{ github.sha }}
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed \
            -e "s|@VERSION@|${VERSION}|g" \
            -e "s|@COMMIT@|${COMMIT}|g" \
            -e "s|@CREATED@|${CREATED}|g" \
            sbom.spdx.json.in > "$SBOM_FILE"
          # Validate JSON syntax
          jq empty "$SBOM_FILE"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json

  release:
    name: Upload the release assets
    needs: [build-test-unix, build-test-windows, source-tarball, sbom]
    outputs:
      digests: ${{ steps.sums.outputs.digests }}
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: release-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.zxc' -o -name '*.zip' \
            -o -name '*.spdx.json' \) -exec mv {} release/ \;
          ls -la release

      # One attestation per asset: archives, sources, SBOM.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*

      - name: Generate checksums.sha256
        id: sums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * | LC_ALL=C sort -k2 > "$RUNNER_TEMP/checksums.sha256"
          mv "$RUNNER_TEMP/checksums.sha256" .
          # The same inventory feeds the signed manifest and the SLSA subjects, so the
          # two can no longer describe different sets of files.
          echo "digests=$(base64 -w0 < checksums.sha256)" >> "$GITHUB_OUTPUT"

      - name: Sign checksums.sha256 with minisign
        working-directory: release
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends minisign
          # Never inside release/: the next step uploads that whole directory.
          key="$RUNNER_TEMP/ms.key"
          trap 'rm -f "$key"' EXIT
          umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # The password goes on stdin, never on the command line.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m checksums.sha256

      - name: Attach them to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

  provenance:
    name: SLSA provenance
    needs: release
    if: github.event_name == 'release'
    permissions:
      actions: read
      contents: write
      id-token: write   # keyless signing via Sigstore / OIDC
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.digests }}
      upload-assets: false

  attach-provenance:
    name: Attach SLSA provenance
    needs: provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download the attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Attach it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROV: ${{ needs.provenance.outputs.provenance-name }}
        run: gh release upload "$GITHUB_REF_NAME" "$PROV" --clobber

  # Last: a registry version can never be reused, so nothing is published until the
  # release itself is complete and its provenance is attached.
  release-wrappers:
    name: Release the wrappers
    needs: attach-provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-slim
    permissions:
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch every wrapper
        run: |
          # No `set -e` short-circuit: one failed dispatch must not strand the others.
          rc=0
          for w in wrapper-python wrapper-nodejs wrapper-wasm wrapper-rust wrapper-go; do
            gh workflow run "$w.yml" --ref "$GITHUB_REF_NAME" || { echo "::error::$w not dispatched"; rc=1; }
          done
          # A dispatch only means accepted. Green here does not mean the packages shipped.
          sleep 10
          for w in wrapper-python wrapper-nodejs wrapper-wasm wrapper-rust wrapper-go; do
            gh run list --workflow "$w.yml" --branch "$GITHUB_REF_NAME" --limit 1 \
              --json url,status --jq '"  \(.[0].status)  \(.[0].url)"' || true
          done
          exit $rc
