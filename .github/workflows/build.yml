name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]      # pre-flight: build and test before the release goes public
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name != 'release' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  build-and-test:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact_name: zxc
            platform: linux-x86_64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            artifact_name: zxc
            platform: linux-arm64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: macOS ARM64
            os: macos-26
            artifact_name: zxc
            platform: macos-arm64
            cmake_flags: "-DZXC_NATIVE_ARCH=OFF"
          - name: Windows x86_64
            os: windows-latest
            artifact_name: zxc.exe
            platform: windows-x86_64
            cmake_flags: "-A x64 -DZXC_NATIVE_ARCH=OFF"
          - name: Windows ARM64
            os: windows-11-arm
            artifact_name: zxc.exe
            platform: windows-arm64
            cmake_flags: "-A ARM64 -DZXC_NATIVE_ARCH=OFF"


    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Latest Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Select Latest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          clang --version

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build 
        run: cmake --build build --config Release --parallel

      - name: Test (native)
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Test CLI
        shell: bash
        run: |
          BUILD_DIR="build"
          # Find binary (handle both Ninja and Visual Studio generators)
          if [ -f "$BUILD_DIR/Release/${{ matrix.artifact_name }}" ]; then
            ZXC_BIN="$BUILD_DIR/Release/${{ matrix.artifact_name }}"
          elif [ -f "$BUILD_DIR/${{ matrix.artifact_name }}" ]; then
            ZXC_BIN="$BUILD_DIR/${{ matrix.artifact_name }}"
          else
            echo "Binary not found for CLI test!"
            find "$BUILD_DIR" -name "${{ matrix.artifact_name }}"
            exit 1
          fi
          
          echo "Testing with binary: $ZXC_BIN"
          chmod +x tests/test_cli.sh
          ./tests/test_cli.sh "$ZXC_BIN"

      - name: Package Release (Archive)
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_BASE="zxc-${VERSION}-${{ matrix.platform }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ARCHIVE="${ARCHIVE_BASE}.zip"
          else
            ARCHIVE="${ARCHIVE_BASE}.tar.gz"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          STAGE="release_staging/${ARCHIVE_BASE}"

          cmake --install build --prefix "$STAGE" --config Release

          if [[ "${{ runner.os }}" != "Windows" ]]; then
            strip "$STAGE/bin/${{ matrix.artifact_name }}"
          fi

          cp LICENSE "$STAGE/LICENSE.txt"
          cp docs/man/zxc.1.md "$STAGE/MANUAL.md"

          cat > "$STAGE/README.md" <<EOF
          # ZXC ${VERSION}

          Asymmetric Lossless Compression Built for Ultra-Fast Decode

          **Contents:**
          - \`bin/\` — \`zxc\` CLI compressor/decompressor
          - \`lib/\` — \`libzxc.a\` static library, pkg-config and CMake files
          - \`include/\` — C headers

          **CLI usage:** See [MANUAL.md](MANUAL.md) for the full reference (synopsis, options, examples).

          **Release history:** https://github.com/${GITHUB_REPOSITORY}/releases

          **Documentation, benchmarks & source:** https://github.com/${GITHUB_REPOSITORY}

          **Verify build provenance (SLSA):** every archive is signed via [GitHub Artifact Attestations](https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds). Verify with:
          \`\`\`
          gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}
          \`\`\`

          License: BSD-3-Clause (see LICENSE.txt)
          EOF

          # Create archive with versioned top-level directory
          cd release_staging
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "../${ARCHIVE}" "${ARCHIVE_BASE}"
          else
            tar -czvf "../${ARCHIVE}" "${ARCHIVE_BASE}"
          fi

      - name: Attest build provenance (SLSA)
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload Artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zxc-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  source-tarball:
    name: Canonical source tarball
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git archive --format=tar --prefix="zxc-${VERSION}/" "$GITHUB_SHA" \
            > "zxc-${VERSION}.tar"
          gzip -n -9 -c "zxc-${VERSION}.tar" > "zxc-${VERSION}.tar.gz"
          sha256sum "zxc-${VERSION}.tar.gz"

      - name: Compress the same tar with zxc
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZXC_NATIVE_ARCH=OFF \
                -DZXC_BUILD_TESTS=OFF
          cmake --build build --parallel
          ZXC=$(find build -type f -name zxc -perm -u+x | head -1)
          test -n "$ZXC" || { echo "::error::no zxc binary under build/"; find build -name 'zxc*'; exit 1; }
          "$ZXC" -7 "zxc-${VERSION}.tar" -o "zxc-${VERSION}.tar.zxc"   # 7 = ULTRA, the densest level

      - name: Attest source tarball provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            zxc-${{ env.VERSION }}.tar.gz
            zxc-${{ env.VERSION }}.tar.zxc

      - name: Upload source artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: |
            zxc-${{ env.VERSION }}.tar.gz
            zxc-${{ env.VERSION }}.tar.zxc

  sbom:
    name: Generate SBOM
    if: github.event_name == 'release'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sanitize ref name
        id: ref
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "version=${slug#v}" >> "$GITHUB_OUTPUT"

      - name: Render SBOM from template
        shell: bash
        env:
          SBOM_FILE: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json
          VERSION: ${{ steps.ref.outputs.slug }}
          COMMIT: ${{ github.sha }}
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed \
            -e "s|@VERSION@|${VERSION}|g" \
            -e "s|@COMMIT@|${COMMIT}|g" \
            -e "s|@CREATED@|${CREATED}|g" \
            sbom.spdx.json.in > "$SBOM_FILE"
          # Validate JSON syntax
          jq empty "$SBOM_FILE"

      - name: Attest SBOM provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: zxc-${{ steps.ref.outputs.version }}-sbom.spdx.json

  release:
    name: Upload the release assets
    needs: [build-and-test, source-tarball, sbom]
    outputs:
      digests: ${{ steps.sums.outputs.digests }}
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tar.zxc' -o -name '*.zip' \
            -o -name '*.spdx.json' \) -exec mv {} release/ \;
          ls -la release

      - name: Generate sha256sums
        id: sums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * | LC_ALL=C sort -k2 > "$RUNNER_TEMP/sha256sums"
          mv "$RUNNER_TEMP/sha256sums" .
          cat sha256sums
          # The same inventory feeds the signed manifest and the SLSA subjects, so the
          # two can no longer describe different sets of files.
          echo "digests=$(base64 -w0 < sha256sums)" >> "$GITHUB_OUTPUT"

      - name: Sign sha256sums with minisign
        working-directory: release
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends minisign
          # Never inside release/: the next step uploads that whole directory.
          key="$RUNNER_TEMP/ms.key"
          trap 'rm -f "$key"' EXIT
          umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # The password goes on stdin, never on the command line.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m sha256sums

      - name: Attach them to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

  provenance:
    name: SLSA provenance
    needs: release
    if: github.event_name == 'release'
    permissions:
      actions: read
      contents: write
      id-token: write   # keyless signing via Sigstore / OIDC
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.digests }}
      upload-assets: false

  attach-provenance:
    name: Attach SLSA provenance
    needs: provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Attach it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROV: ${{ needs.provenance.outputs.provenance-name }}
        run: gh release upload "$GITHUB_REF_NAME" "$PROV" --clobber

  # Last: a registry version can never be reused, so nothing is published until the
  # release itself is complete and its provenance is attached.
  release-wrappers:
    name: Release the wrappers
    needs: attach-provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-slim
    permissions:
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch every wrapper
        run: |
          # No `set -e` short-circuit: one failed dispatch must not strand the others.
          rc=0
          for w in wrapper-python wrapper-nodejs wrapper-wasm wrapper-rust wrapper-go; do
            gh workflow run "$w.yml" --ref "$GITHUB_REF_NAME" || { echo "::error::$w not dispatched"; rc=1; }
          done
          # A dispatch only means accepted. Green here does not mean the packages shipped.
          sleep 10
          for w in wrapper-python wrapper-nodejs wrapper-wasm wrapper-rust wrapper-go; do
            gh run list --workflow "$w.yml" --branch "$GITHUB_REF_NAME" --limit 1 \
              --json url,status --jq '"  \(.[0].status)  \(.[0].url)"' || true
          done
          exit $rc
