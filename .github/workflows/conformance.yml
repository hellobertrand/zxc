name: Conformance Vector Stability

# Fails if a single byte of the published conformance corpus changes relative to
# its manifest. These vectors are what third-party ZXC decoders validate against,
# so drift must be deliberate (see conformance/README.md).
#
# The manifest covers the .expected plaintexts too: moving one silently would
# move the reference every external decoder is measured against.
#
# Separate from golden.yml so that job's required check keeps its name.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  byte-stability:
    name: Conformance vectors - byte stability
    runs-on: ubuntu-slim

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every frozen corpus
        run: |
          # One frozen corpus per format version. Looping covers a new version
          # without editing this file, and keeps verifying the old ones.
          shopt -s nullglob
          dirs=(conformance/v*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::No conformance/v<N>/ corpus found."
            exit 1
          fi
          for d in "${dirs[@]}"; do
            d="${d%/}"
            echo "== $d (format version $(cat "$d/FORMAT_VERSION"))"

            # Every corpus file must be listed in the manifest, and vice versa.
            in_dir=$(find "$d/valid" "$d/invalid" -maxdepth 1 \
                       \( -name '*.zxc' -o -name '*.expected' -o -name '*.zxd' \) | sort)
            in_manifest=$(awk '{print $2}' "$d/vectors.sha256" | sort)
            if ! diff <(printf '%s\n' "$in_dir") <(printf '%s\n' "$in_manifest"); then
              echo "::error::$d vector set does not match $d/vectors.sha256."
              exit 1
            fi

            # Bijection: a vector without its reference output cannot be
            # checked externally, an orphan .expected is dead weight.
            archives=$(find "$d/valid" -maxdepth 1 -name '*.zxc' | sed 's/\.zxc$/.expected/' | sort)
            outputs=$(find "$d/valid" -maxdepth 1 -name '*.expected' | sort)
            if ! diff <(printf '%s\n' "$archives") <(printf '%s\n' "$outputs"); then
              echo "::error::$d archives and .expected outputs are not in bijection."
              exit 1
            fi

            # A single changed byte in any vector fails the job.
            sha256sum -c "$d/vectors.sha256"
          done
