name: Wrapper Node.js

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-11-arm
            arch: ARM64
    defaults:
      run:
        working-directory: ./wrappers/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Latest Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Select Latest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          clang --version

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies and build
        run: npm ci

      - name: Run tests
        run: npx vitest run --globals

      - name: Package prebuilt addon
        run: |
          mkdir -p prebuilds/${{ matrix.os }}-${{ matrix.arch }}
          cp build/Release/zxc_nodejs.node prebuilds/${{ matrix.os }}-${{ matrix.arch }}/

      - name: Upload prebuilt addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-${{ matrix.os }}-${{ matrix.arch }}
          path: wrappers/nodejs/prebuilds/

  test:
    name: Test on ${{ matrix.os }} Node ${{ matrix.node }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-latest, windows-11-arm]
        node: ["22", "24"]
    defaults:
      run:
        working-directory: ./wrappers/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Latest Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Select Latest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app
          clang --version

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies and build
        run: npm ci

      - name: Run tests
        run: npx vitest run --globals

  package:
    name: Install the packed tarball
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wrappers/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Pack the tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install it into an empty project and use it
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir consumer && cd consumer
          tar xzf ../zxc-compress-*.tgz
          cp "$GITHUB_WORKSPACE/wrappers/nodejs/package-lock.json" package/
          (cd package && npm ci --omit=dev)
          node -e '
            const zxc = require("./package");
            const data = Buffer.from("zxc packed-tarball roundtrip ".repeat(2000));
            const back = zxc.decompress(zxc.compress(data, { level: 6 }));
            if (!back.equals(data)) throw new Error("roundtrip mismatch");
            console.log("packed tarball installs, compiles and round-trips");
          '

  publish:
    name: Publish to npm
    needs: [build, test, package]
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: ./wrappers/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify Version Matches Release Tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Remove 'v' prefix if present
          RELEASE_VERSION="${RELEASE_TAG#v}"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: Release tag is $RELEASE_VERSION but package.json has $PACKAGE_VERSION"
            exit 1
          fi

          echo "Version matches: $RELEASE_VERSION"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: success()
        run: |
          echo "Successfully published zxc-compress to npm!"
          echo "Package: https://www.npmjs.com/package/zxc-compress"
