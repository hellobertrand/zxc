# Manual check that GPG_PRIVATE_KEY and GPG_PASSPHRASE still work together, and that
# .github/release-key.asc can verify what they produce. Run it after any key change,
# before trusting a release to it. Never runs on its own.
name: Signing self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-test:
    name: Sign and verify a throwaway file
    # Fenced on main: workflow_dispatch takes the definition from the chosen ref, so
    # without this anyone able to push a branch could dispatch a rewritten copy of this
    # file and walk off with GPG_PRIVATE_KEY.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import the CI subkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          echo "--- what CI holds ---"
          gpg --list-secret-keys --keyid-format LONG

      - name: Sign, then verify as a user would
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "zxc signing self-test" > sample.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor sample.txt

          # A fresh keyring with only the published key: this is what users have, so it
          # also catches a release-key.asc missing the subkey CI just signed with.
          H=$(mktemp -d) && chmod 700 "$H"
          gpg --homedir "$H" --batch --quiet --import .github/release-key.asc
          gpg --homedir "$H" --verify sample.txt.asc sample.txt
          echo "OK: the secrets match and the published key verifies their output"
