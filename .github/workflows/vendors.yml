name: Update Vendors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  update-rapidhash-header:
    runs-on: ubuntu-slim

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest rapidhash.h
        run: |
          curl -fsSL -o rapidhash.h.upstream https://raw.githubusercontent.com/Nicoshev/rapidhash/refs/heads/master/rapidhash.h
          # Upstream carries the MIT text but no SPDX tag; prepend one unless it ships its own.
          if head -n 2 rapidhash.h.upstream | grep -q 'SPDX-License-Identifier'; then
            mv rapidhash.h.upstream src/lib/vendors/rapidhash.h
          else
            { echo '/* SPDX-License-Identifier: MIT */'; cat rapidhash.h.upstream; } > src/lib/vendors/rapidhash.h
            rm rapidhash.h.upstream
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update rapidhash.h from upstream"
          title: "Automatic update of rapidhash.h"
          body: | 
              This PR updates `rapidhash.h` with the latest version from the official repository.
              Source : [Nicoshev/rapidhash](https://github.com/Nicoshev/rapidhash)
          branch: auto-update/rapidhash
          delete-branch: true