name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
  pull_request:
    branches: [ main, candidate ]
    paths:
      - 'src/**'
      - 'include/**'

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  lzbench-benchmark:
    name: Run Benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs: standard arm64 runner (Apple M1); push/dispatch: xlarge (Apple M2)
        os:
          - ubuntu-latest
          - ${{ github.event_name == 'pull_request' && 'macos-26' || 'macos-26-xlarge' }}

    env:
        LZBENCH_DIR: lzbench
        SILESIA_TAR: silesia.tar

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone LZbench
        run: |
          # git clone --depth 1 https://github.com/inikep/lzbench "${LZBENCH_DIR}"
          git clone -b zxc-ctx-params https://github.com/hellobertrand/lzbench "${LZBENCH_DIR}"

      - name: Copy Lib ZXC
        run: |
          mkdir -p ${LZBENCH_DIR}/lz+entropy/zxc/include/
          mkdir -p ${LZBENCH_DIR}/lz+entropy/zxc/src/lib/

          cp -r include ${LZBENCH_DIR}/lz+entropy/zxc/
          cp -r src/lib ${LZBENCH_DIR}/lz+entropy/zxc/src/

      - name: Build Lzbench
        working-directory: ${{ env.LZBENCH_DIR }}
        run: |
          BUILD_ONLY="ZXC LZ4 LZAV SNAPPY ZSTD ZLIB"

          # GCC 14 on Linux: the compiler of the published benchmarks
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC=gcc-14 CXX=g++-14
          fi

          make -j BUILD_ONLY="${BUILD_ONLY}" CC="${CC:-cc}" MOREFLAGS="-march=native"

      - name: Cache Silesia Corpus
        id: cache-silesia
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SILESIA_TAR }}
          key: silesia-tar-v1

      - name: Download Silesia Corpus
        if: steps.cache-silesia.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz -O silesia.tar.gz
          gunzip silesia.tar.gz

      - name: SHA256 Checksum
        run: |
          shasum -a 256 "${SILESIA_TAR}"

      - name: Run Lzbench on Silesia Corpus
        working-directory: ${{ env.LZBENCH_DIR }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CODECS="memcpy/zxc/lz4"
          else
            CODECS="memcpy/zxc/lz4/lz4fast,17/lz4hc,9/lzav,1/snappy/zstd_fast,-1/zstd,1,3/zlib,1"
          fi
      
          ./lzbench -e"${CODECS}" -j -t8,8 -o1 "../${SILESIA_TAR}" > ../benchmark.md
      
          echo "Benchmark finished. First lines:"
          head -n 40 ../benchmark.md

      - name: Add Benchmark to Job Summary
        run: |
          echo "### Benchmark Result (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          cat benchmark.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Benchmark Result as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ matrix.os }}-${{ github.sha }}
          path: benchmark.md
          if-no-files-found: error
          retention-days: 10