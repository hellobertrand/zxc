name: Conformance Vector Stability

# Fails if a single byte of the published conformance corpus changes relative to
# the committed manifest (conformance/vectors.sha256). These vectors are the
# reference third-party ZXC decoders validate against, so drift must be a
# deliberate act: regenerate the corpus and refresh the manifest in the same
# commit (see conformance/README.md).
#
# The manifest covers the compressed archives, the .expected plaintexts they
# decode to, and the .zxd dictionaries - a silent change to an .expected would
# move the reference every external decoder is measured against, which is at
# least as damaging as a change to a .zxc.
#
# Mirrors .github/workflows/golden.yml, which does the same for the wire-format
# golden files. Kept as its own workflow rather than a job there so the existing
# required check keeps its name.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  byte-stability:
    name: Conformance vectors - byte stability
    runs-on: ubuntu-slim

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify vector manifest is complete
        run: |
          # Every corpus file must be listed in the manifest, and vice versa.
          # This catches a vector added or removed without updating it.
          in_dir=$(find conformance/valid conformance/invalid -maxdepth 1 \
                     \( -name '*.zxc' -o -name '*.expected' -o -name '*.zxd' \) | sort)
          in_manifest=$(awk '{print $2}' conformance/vectors.sha256 | sort)
          if ! diff <(printf '%s\n' "$in_dir") <(printf '%s\n' "$in_manifest"); then
            echo "::error::Conformance vector set does not match conformance/vectors.sha256."
            echo "Refresh it as documented in conformance/README.md."
            exit 1
          fi

      - name: Verify every valid vector has its expected output
        run: |
          # valid/<name>.zxc <-> valid/<name>.expected must be a bijection: a
          # vector without its reference output cannot be checked by an external
          # decoder, and an orphan .expected is dead weight in a published corpus.
          archives=$(find conformance/valid -maxdepth 1 -name '*.zxc' | sed 's/\.zxc$/.expected/' | sort)
          outputs=$(find conformance/valid -maxdepth 1 -name '*.expected' | sort)
          if ! diff <(printf '%s\n' "$archives") <(printf '%s\n' "$outputs"); then
            echo "::error::Valid archives and .expected outputs are not in bijection."
            exit 1
          fi

      - name: Verify vector bytes are unchanged
        run: |
          # sha256sum -c fails on any content mismatch, so a single changed byte
          # in any vector fails the job.
          sha256sum -c conformance/vectors.sha256
