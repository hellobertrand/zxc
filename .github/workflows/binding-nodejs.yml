name: Binding Node.js

on:
  workflow_dispatch:   # also how build.yml's release-wrappers publishes, at the tag
  push:
    branches: [ main, 'release/**' ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'bindings/nodejs/**'
      - '.github/workflows/binding-nodejs.yml'
  pull_request:
    branches: [ main, candidate, 'release/**' ]
    paths:
      - 'include/**'
      - 'bindings/nodejs/**'
      - '.github/workflows/binding-nodejs.yml'

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-11-arm
            arch: ARM64
    defaults:
      run:
        working-directory: ./bindings/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build
        run: npm ci

      - name: Run tests
        run: npx vitest run --globals

      - name: Package prebuilt addon
        run: |
          mkdir -p prebuilds/${{ matrix.os }}-${{ matrix.arch }}
          cp build/Release/zxc_nodejs.node prebuilds/${{ matrix.os }}-${{ matrix.arch }}/

      - name: Upload prebuilt addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.os }}-${{ matrix.arch }}
          path: bindings/nodejs/prebuilds/

  test:
    name: Test on ${{ matrix.os }} Node ${{ matrix.node }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-latest, windows-11-arm]
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: ./bindings/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies and build
        run: npm ci

      - name: Run tests
        run: npx vitest run --globals

  package:
    name: Install the packed tarball
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bindings/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Pack the tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install it into an empty project and use it
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir consumer && cd consumer
          tar xzf ../zxc-compress-*.tgz
          cp "$GITHUB_WORKSPACE/bindings/nodejs/package-lock.json" package/
          (cd package && npm ci --omit=dev)
          node -e '
            const zxc = require("./package");
            const data = Buffer.from("zxc packed-tarball roundtrip ".repeat(2000));
            const back = zxc.decompress(zxc.compress(data, { level: 6 }));
            if (!back.equals(data)) throw new Error("roundtrip mismatch");
            console.log("packed tarball installs, compiles and round-trips");
          '

  publish:
    name: Publish to npm
    needs: [build, test, package]
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./bindings/nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"

      - name: Verify Version Matches Release Tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Remove 'v' prefix if present
          RELEASE_VERSION="${RELEASE_TAG#v}"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: Release tag is $RELEASE_VERSION but package.json has $PACKAGE_VERSION"
            exit 1
          fi

          echo "Version matches: $RELEASE_VERSION"

      # npm moves `latest` to whatever it publishes: a patch on an older line
      # (1.0.1 after 1.1.0) goes under its own dist-tag, release-1.0, instead.
      - name: Choose the dist-tag
        id: dist-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          name=$(node -p "require('./package.json').name")
          latest=$(npm view "$name" dist-tags.latest)
          if [ "$(printf '%s\n' "$version" "$latest" | sort -V | tail -n 1)" = "$version" ]; then
            tag=latest
          else
            tag="release-${version%.*}"
          fi
          echo "Publishing $name@$version as '$tag' (latest: $latest)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Summary
        if: success()
        run: |
          echo "Successfully published zxc-compress to npm!"
          echo "Package: https://www.npmjs.com/package/zxc-compress"
