name: Packaging (Consumer Integration)

# Validates what an *installed* ZXC hands to a downstream project -- the gap
# that let the Windows static packaging break ship (libzxc.pc did not propagate
# ZXC_STATIC_DEFINE, so consumers got unresolved __imp_zxc_*).
#
# Four consumption paths, static and shared: find_package(zxc), pkg-config,
# direct integration (-I + raw library, no defines at all), and pkg-config from
# a relocated install prefix.
#
# A fifth path consumes no install at all: kernel ports vendor the sources and
# build a subset of them behind defines (see the block-only job below).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, candidate ]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  consume:
    name: "Consume installed ZXC (${{ matrix.name }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            runner: ubuntu-latest
          - name: Windows MSVC
            runner: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build & install ZXC (static and shared)
        shell: bash
        run: |
          set -euo pipefail
          for LIB_TYPE in static shared; do
            SHARED_FLAG=OFF
            if [ "$LIB_TYPE" = shared ]; then SHARED_FLAG=ON; fi
            cmake -S . -B "build_$LIB_TYPE" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PWD/inst_$LIB_TYPE" \
              -DZXC_NATIVE_ARCH=OFF \
              -DZXC_BUILD_TESTS=OFF \
              -DZXC_BUILD_CLI=OFF \
              -DBUILD_SHARED_LIBS="$SHARED_FLAG"
            cmake --build "build_$LIB_TYPE" --config Release -j
            cmake --install "build_$LIB_TYPE" --config Release
          done

      # The flags themselves, before any consumer sees them. Cheap, and pins the
      # exact two regressions this workflow exists for.
      - name: Check generated libzxc.pc
        shell: bash
        run: |
          set -euo pipefail
          find inst_static inst_shared -name libzxc.pc | while read -r pc; do cat "$pc"; done

          static_pc=$(find inst_static -name libzxc.pc)
          shared_pc=$(find inst_shared -name libzxc.pc)

          grep -q -- '-DZXC_STATIC_DEFINE' "$static_pc" \
            || { echo "::error::static libzxc.pc is missing -DZXC_STATIC_DEFINE"; exit 1; }
          grep -q -- '-DZXC_DLL_IMPORT' "$shared_pc" \
            || { echo "::error::shared libzxc.pc is missing -DZXC_DLL_IMPORT"; exit 1; }

          # -pthread is a POSIX toolchain flag; MSVC ignores it with LNK4044.
          if [ "$RUNNER_OS" = Windows ]; then
            if grep -q -- '-pthread' "$static_pc" "$shared_pc"; then
              echo "::error::libzxc.pc emits -pthread on a non-pthread toolchain"; exit 1
            fi
          else
            grep -q 'Libs.private:.*-pthread' "$static_pc" \
              || { echo "::error::static libzxc.pc lost -pthread on a pthread toolchain"; exit 1; }
          fi

      - name: Consume via find_package(zxc)
        shell: bash
        run: |
          set -euo pipefail
          for LIB_TYPE in static shared; do
            cmake -S tests/packaging -B "cm_$LIB_TYPE" \
              -DCMAKE_BUILD_TYPE=Release \
              -DZXC_CONSUME_MODE=find_package \
              -DCMAKE_PREFIX_PATH="$PWD/inst_$LIB_TYPE"
            cmake --build "cm_$LIB_TYPE" --config Release
          done

      # No defines, no usage requirements: only zxc_export.h's own default keeps
      # this linking. The case that produced unresolved __imp_zxc_* on Windows.
      - name: Consume by direct integration (no defines)
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find inst_static -name 'libzxc.a' -o -name 'zxc.lib' -o -name 'libzxc.lib' | head -1)
          test -n "$lib" || { echo "::error::no static library found in inst_static"; exit 1; }
          cmake -S tests/packaging -B cm_direct \
            -DCMAKE_BUILD_TYPE=Release \
            -DZXC_CONSUME_MODE=direct \
            -DZXC_INCLUDE_DIR="$PWD/inst_static/include" \
            -DZXC_LIBRARY="$PWD/$lib"
          cmake --build cm_direct --config Release

      # The path that was broken: the .pc file is the whole contract. POSIX only;
      # the .pc content check above covers Windows.
      - name: Consume via pkg-config
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v pkg-config >/dev/null \
            || { echo "::error::pkg-config is not installed on this runner"; exit 1; }

          for LIB_TYPE in static shared; do
            # CMAKE_INSTALL_LIBDIR is not always "lib" (lib64, multiarch), so
            # locate the .pc instead of assuming its path.
            pc=$(find "inst_$LIB_TYPE" -name libzxc.pc | head -1)
            test -n "$pc" || { echo "::error::no libzxc.pc in inst_$LIB_TYPE"; exit 1; }
            PKG_CONFIG_PATH="$PWD/$(dirname "$pc")"
            export PKG_CONFIG_PATH
            libdir="$PWD/$(dirname "$(dirname "$pc")")"

            STATIC_ARG=""
            if [ "$LIB_TYPE" = static ]; then STATIC_ARG="--static"; fi

            # Via a variable, not inline: a bare $(pkg-config ...) that fails is
            # swallowed by errexit and cc would run with no flags at all.
            flags=$(pkg-config $STATIC_ARG --cflags --libs libzxc)
            echo "pkg-config ($LIB_TYPE): $flags"

            # shellcheck disable=SC2086
            cc tests/packaging/consumer.c $flags -o "consumer_$LIB_TYPE"
            LD_LIBRARY_PATH="$libdir" "./consumer_$LIB_TYPE"
          done

      # Release archives are staged with --prefix, then extracted elsewhere: a .pc
      # that baked its prefix at configure time would point at the runner.
      - name: Consume via pkg-config after relocation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for LIB_TYPE in static shared; do
            rm -rf staged relocated
            cmake --install "build_$LIB_TYPE" --config Release --prefix "$PWD/staged"
            mv staged relocated

            pc=$(find relocated -name libzxc.pc | head -1)
            test -n "$pc" || { echo "::error::no libzxc.pc in the staged $LIB_TYPE prefix"; exit 1; }
            PKG_CONFIG_PATH="$PWD/$(dirname "$pc")"
            export PKG_CONFIG_PATH

            # Ask the file under test rather than re-deriving from its path.
            prefix=$(pkg-config --variable=prefix libzxc)
            case "$prefix/" in
              "$PWD/relocated/"*) ;;
              *) echo "::error::$LIB_TYPE libzxc.pc resolves to $prefix, outside the relocated tree"
                 cat "$pc"; exit 1 ;;
            esac

            STATIC_ARG=""
            if [ "$LIB_TYPE" = static ]; then STATIC_ARG="--static"; fi
            flags=$(pkg-config $STATIC_ARG --cflags --libs libzxc)
            echo "pkg-config ($LIB_TYPE, relocated): $flags"

            # shellcheck disable=SC2086
            cc tests/packaging/consumer.c $flags -o "consumer_relocated_$LIB_TYPE"
            LD_LIBRARY_PATH="$(pkg-config --variable=libdir libzxc)" \
              "./consumer_relocated_$LIB_TYPE"
          done

  no-frame-api:
    name: "Consume vendored sources (block-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile the block-only subset and check what it reaches for
        run: |
          # Twice: stock zxc_deps.h, then with the overrides KERNEL.md prescribes.
          # Kernel flags: gnu11, -Wmissing-prototypes (6.8+), no glibc fortify.
          mkdir -p /tmp/nf
          cat > /tmp/nf/host.h <<'EOF'
          void *host_malloc(unsigned long);
          void *host_calloc(unsigned long, unsigned long);
          void host_free(void *);
          void *host_aligned_alloc(unsigned long, unsigned long);
          void host_aligned_free(void *);
          unsigned int host_popcount32(unsigned int);
          unsigned int host_popcount64(unsigned long long);
          /* Undefined in KERNEL.md: a use must fail. */
          void *zxc_realloc_unused_in_the_kernel_port(void *, unsigned long);
          EOF
          hostflags=(-DZXC_USE_C11_ATOMICS=0 -include /tmp/nf/host.h
                     '-DZXC_MALLOC(s)=host_malloc(s)'
                     '-DZXC_CALLOC(n,s)=host_calloc(n,s)'
                     '-DZXC_FREE(p)=host_free(p)'
                     '-DZXC_REALLOC(p,s)=zxc_realloc_unused_in_the_kernel_port(p,s)'
                     '-DZXC_ALIGNED_MALLOC(s,a)=host_aligned_alloc(s,a)'
                     '-DZXC_ALIGNED_FREE(p)=host_aligned_free(p)'
                     '-DZXC_POPCOUNT32(v)=host_popcount32(v)'
                     '-DZXC_POPCOUNT64(v)=host_popcount64(v)')
          # Exact names: kernel-exported string functions and stack protector,
          # plus libc allocators and libgcc popcount (stock) or host_* (host).
          common='memcpy|memmove|memset|memcmp|__stack_chk_fail|__stack_chk_guard'
          for deps in stock host; do
            mkdir -p "/tmp/nf/$deps"
            flags=(); [ "$deps" = host ] && flags=("${hostflags[@]}")
            for f in zxc_common zxc_pivco_tables zxc_dispatch zxc_compress zxc_decompress zxc_huffman; do
              cc -c -O2 -std=gnu11 -Wall -Wextra -Wmissing-prototypes -Werror -U_FORTIFY_SOURCE \
                 -DZXC_STATIC_DEFINE -DZXC_NO_FRAME_API -DZXC_DISABLE_SIMD \
                 -DZXC_FUNCTION_SUFFIX=_default "${flags[@]}" \
                 -Iinclude -Isrc/lib -Isrc/lib/vendors \
                 -o "/tmp/nf/$deps/$f.o" "src/lib/$f.c"
            done
            # POSIX nm: one symbol per line, name then type; per-file headers have
            # one field and drop out. Whatever the subset needs and does not
            # define must be on the list: a frame, dictionary or seekable
            # symbol, a new libc call or a compiler-runtime helper fails here.
            nm -P /tmp/nf/$deps/*.o \
              | awk 'NF > 1 && $2 == "U" { u[$1] } NF > 1 && $2 != "U" { d[$1] }
                     END { for (s in u) if (!(s in d)) print s }' | sort > "/tmp/nf/$deps/needs"
            case "$deps" in
              stock) allowed="^($common|malloc|calloc|realloc|free|posix_memalign|__popcountsi2|__popcountdi2)\$" ;;
              host)  allowed="^($common|host_[a-z0-9_]+)\$" ;;
            esac
            if grep -Ev "$allowed" "/tmp/nf/$deps/needs"; then
              echo "::error::block-only build ($deps deps) reaches outside its sources and the libc"
              exit 1
            fi
          done
