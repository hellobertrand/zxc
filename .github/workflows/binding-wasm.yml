name: Binding WASM

on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**' ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'bindings/wasm/**'
      - 'CMakeLists.txt'
      - '.github/workflows/binding-wasm.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-build:
    name: Build & Test WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.10

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm --parallel

      - name: Verify outputs
        run: |
          ls -lh build-wasm/zxc.js build-wasm/zxc.wasm
          echo "--- WASM file size ---"
          wc -c build-wasm/zxc.wasm

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run Tests
        run: BUILD_DIR=build-wasm node bindings/wasm/test.mjs

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zxc-wasm
          path: |
            build-wasm/zxc.js
            build-wasm/zxc.wasm
            bindings/wasm/zxc_wasm.js
            bindings/wasm/package.json
            bindings/wasm/README.md
          retention-days: 30

  publish:
    name: Publish to npm
    needs: wasm-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.10

      - name: Build
        run: |
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --parallel

      - name: Stage package contents
        # zxc_wasm.js dynamically imports its sibling ./zxc.js, so both
        # Emscripten outputs must ship next to it (see package.json "files").
        run: cp build-wasm/zxc.js build-wasm/zxc.wasm bindings/wasm/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          registry-url: "https://registry.npmjs.org"

      - name: Verify Version Matches Release Tag
        working-directory: ./bindings/wasm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Remove 'v' prefix if present
          RELEASE_VERSION="${RELEASE_TAG#v}"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: Release tag is $RELEASE_VERSION but package.json has $PACKAGE_VERSION"
            exit 1
          fi

          echo "Version matches: $RELEASE_VERSION"

      - name: Verify Package Contents
        working-directory: ./bindings/wasm
        run: |
          npm pack --dry-run
          # The tarball is useless without the Emscripten outputs.
          for f in zxc_wasm.js zxc.js zxc.wasm; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Publish to npm
        working-directory: ./bindings/wasm
        run: npm publish --access public

      - name: Summary
        if: success()
        run: |
          echo "Successfully published zxc-wasm to npm!"
          echo "Package: https://www.npmjs.com/package/zxc-wasm"
