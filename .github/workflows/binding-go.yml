name: Binding Go

on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**' ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'bindings/go/**'
      - '.github/workflows/binding-go.yml'
  pull_request:
    branches: [ main, 'release/**' ]
    paths:
      - 'include/**'
      - 'bindings/go/**'
      - '.github/workflows/binding-go.yml'

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-latest, windows-11-arm]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          gcc-14 --version

      - name: Install llvm-mingw (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $LLVM_MINGW_URL = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/llvm-mingw-20260407-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $LLVM_MINGW_URL -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\llvm-mingw
          $MINGW_BIN = "C:\llvm-mingw\llvm-mingw-20260407-ucrt-aarch64\bin"
          echo "$MINGW_BIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=aarch64-w64-mingw32-gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'
          cache: false

      - name: Run Go Tests
        working-directory: ./bindings/go
        env:
          CGO_ENABLED: "1"
        run: go test -v -count=1 ./...

      - name: Run Go Tests from a Copy of the Module
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: |
          # What `go get` sees: nothing above the module directory.
          bindings/go/scripts/vendor_core.sh
          cp -R bindings/go "$RUNNER_TEMP/module"
          rm -rf bindings/go/zxc-core
          cd "$RUNNER_TEMP/module"
          go test -count=1 ./...

      - name: Run Go Benchmarks
        if: github.event_name != 'pull_request'
        working-directory: ./bindings/go
        env:
          CGO_ENABLED: "1"
        run: go test -bench=. -benchmem -count=1 ./...

  tag-module:
    name: Tag Go Module
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Tag the Go submodule
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Go resolves versions of a submodule from tags prefixed with the
          # module directory. Without this tag, `go get ...@v0.13.3` fails and
          # consumers are stuck on pseudo-versions of the default branch.
          MODULE_TAG="bindings/go/${RELEASE_TAG}"

          if git ls-remote --exit-code --tags origin "refs/tags/${MODULE_TAG}" > /dev/null 2>&1; then
            echo "${MODULE_TAG} already exists, nothing to do"
            exit 0
          fi

          # The tag gets its own commit on top of the release, off every branch:
          # the module zip must hold the C core, which the tree keeps above it.
          bindings/go/scripts/vendor_core.sh
          git add -f bindings/go/zxc-core
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(go): vendor the C core for ${RELEASE_TAG}"
          git tag "${MODULE_TAG}" HEAD
          git push origin "${MODULE_TAG}"

          echo "Tagged ${MODULE_TAG} -> $(git rev-parse --short HEAD)"
