name: Windows Kernel Library

# Builds contrib/windows-kernel: the kernel-mode static library and the
# self-test driver that links it, then asserts the image's imports, machine
# and subsystem. Like kernel.yml, off the PR path unless the tree or the
# library change.
#
# The runner image carries the WDK's Visual Studio extension (the kernel-mode
# toolset) but not the kit itself (km headers and libraries), so the job
# installs the 26100 kit with Microsoft's installer first. Plan B (the
# Windows 7 target and x86) is not built here: it needs the 22000 kit, whose
# MSBuild task assemblies exist for Visual Studio 2019 only, which the image
# does not carry. It is built locally against the 22000 EWDK (see the README).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 2'
  push:
    branches: [ main ]
    paths:
      - 'contrib/windows-kernel/**'
      - 'include/**'
      - 'src/lib/**'
      - '.github/workflows/windows-kernel.yml'
  pull_request:
    branches: [ main, candidate ]
    paths:
      - 'contrib/windows-kernel/**'
      - 'include/**'
      - 'src/lib/**'
      - '.github/workflows/windows-kernel.yml'

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  library:
    name: "Kernel library (${{ matrix.platform }}, Windows 10 2004)"
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WDK 10.0.26100.6584, the VS 2022 line matching the image's SDK 26100
      # and its WDK extension 10.0.26100.16. Skipped when a kit is already there.
      - name: Install the WDK kit content
        shell: pwsh
        run: |
          $km = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\ntddk.h" -ErrorAction SilentlyContinue
          if ($km) { "kernel headers already present: $($km.FullName)"; exit 0 }
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2335869" -OutFile "$env:RUNNER_TEMP\wdksetup.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\wdksetup.exe" -ArgumentList "/features", "+", "/quiet", "/norestart" -Wait -PassThru
          if ($p.ExitCode) { Write-Host "::error::wdksetup.exe exited $($p.ExitCode)"; exit 1 }
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\ntddk.h" -ErrorAction SilentlyContinue)) {
            Write-Host "::error::kernel headers still missing after the WDK install"; exit 1
          }

      - name: Locate the toolchain
        id: tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # Visual Studio 2022 with the WDK extension: the 26100 kit ships MSBuild
          # task assemblies for Visual Studio 2022 only, and the image also carries
          # Visual Studio 2026, which vswhere -latest would pick.
          $vs = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Component.Microsoft.Windows.DriverKit -property installationPath | Select-Object -First 1
          $msbuild = if ($vs) { Get-ChildItem "$vs\MSBuild\*\Bin\MSBuild.exe" | Select-Object -First 1 -ExpandProperty FullName }
          $dumpbin = if ($vs) { Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName }
          $km = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\ntddk.h" -ErrorAction SilentlyContinue | Select-Object -Last 1
          foreach ($pair in @(@("Visual Studio with the WDK extension", $vs), @("MSBuild", $msbuild), @("dumpbin", $dumpbin), @("kernel headers (km\ntddk.h)", $km))) {
            if (-not $pair[1]) { Write-Host "::error::$($pair[0]) not found on this runner image"; exit 1 }
            "$($pair[0]): $($pair[1])"
          }
          "msbuild=$msbuild" >> $env:GITHUB_OUTPUT
          "dumpbin=$dumpbin" >> $env:GITHUB_OUTPUT

      - name: Build the library and the self-test driver
        shell: pwsh
        run: |
          & "${{ steps.tools.outputs.msbuild }}" contrib\windows-kernel\zxc_selftest.vcxproj /nologo /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:SignMode=Off
          exit $LASTEXITCODE

      - name: Check the image
        shell: pwsh
        run: |
          .\contrib\windows-kernel\check-image.ps1 -Image contrib\windows-kernel\build\${{ matrix.platform }}\Release\zxc_selftest.sys -Machine ${{ matrix.platform }} -SubsystemVersion 10.00 -Dumpbin "${{ steps.tools.outputs.dumpbin }}"
