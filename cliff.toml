# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{% if version -%}
[v{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
{% for commit in commits -%}
{{ group | split(pat="-") | last }}: {{ commit.message | split(pat="\n") | first | replace_regex(from="^(feat|fix|perf|docs?|build|ci|chore|refactor|test|api|cli|port|portability|misc|style)(\\([^)]+\\))?!?:\\s*", to="") | trim | upper_first }}
{% endfor -%}
{% endfor %}

"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false

# Order matters: the first matching rule wins.
# Skip rules first, then specific categories, then a catch-all.
commit_parsers = [
  # ---- Skip noise ----
  { message = "^(\\w+(\\([^)]+\\))?!?:\\s*)?[Bb]ump (to )?v?[0-9]",                                                   skip = true },
  { message = "^chore\\(release\\)",                                                                                  skip = true },
  { message = "^docs\\(changelog\\)",                                                                                 skip = true },
  { message = "(?i)\\.ds_store",                                                                                      skip = true },
  { message = "^[Mm]erge ",                                                                                           skip = true },

  # ---- Categories: the title's type and scope decide ----
  { message = "^\\w+\\((cli|man)\\)",                                                                                 group = "04-cli" },
  { message = "^\\w+\\((site|docs?|readme)\\)",                                                                       group = "07-doc" },
  { message = "^(feat|api)[(:!]",                                                                                     group = "01-api" },
  { message = "^refactor\\(api\\)",                                                                                   group = "01-api" },
  { message = "^fix[(:!]",                                                                                            group = "02-fix" },
  { message = "^perf[(:!]",                                                                                           group = "03-perf" },
  { message = "^cli[(:!]",                                                                                            group = "04-cli" },
  { message = "^(build|ci|chore)[(:!]",                                                                               group = "05-build" },
  { message = "^port(ability)?[(:!]",                                                                                 group = "06-portability" },
  { message = "^docs?[(:!]",                                                                                          group = "07-doc" },
  { message = "^(refactor|test|style|misc)[(:!]",                                                                     group = "08-misc" },

  # ---- Titles without a type: keywords ----
  { message = "(?i)\\bapi\\b",                                                                                        group = "01-api" },
  { message = "^[Ff]ix(es|ed)? ",                                                                                     group = "02-fix" },
  { message = "^[Oo]ptimi[sz]e",                                                                                      group = "03-perf" },
  { message = "(?i)speed[- ]?up|faster|throughput",                                                                   group = "03-perf" },
  { message = "(?i)\\bcli\\b",                                                                                        group = "04-cli" },
  { message = "(?i)workflow|makefile|cmake|wrapper",                                                                  group = "05-build" },
  { message = "(?i)portability|android|windows|linux|macos|emscripten|wasm|freebsd|qnx",                              group = "06-portability" },
  { message = "(?i)readme|whitepaper|documentation|benchmark.*(graph|figure|chart)|refresh.*benchmark|update.*docs?", group = "07-doc" },

  # ---- Catch-all ----
  { message = ".*",                                                                                                   group = "08-misc" },
]
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"
